<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 Local AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@100;200;300;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #020a2c;
  --mid: #0a3a9e;
  --glow: #5fb4ff;
  --ink: #eaf3ff;
  --dim: rgba(234, 243, 255, .55);
  --faint: rgba(234, 243, 255, .16);
  --panel: rgba(4, 16, 60, .42);
  --warm: #ffd27a;
  --display: "Saira", "Segoe UI", sans-serif;
  --body: "Zen Kaku Gothic New", "Yu Gothic UI", "Meiryo", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--body);
  font-weight: 300;
  color: var(--ink);
  background: radial-gradient(120% 90% at 20% 0%, #1c5fd0 0%, var(--mid) 28%, var(--deep) 78%);
  overflow: hidden;
}
#waves { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.shell {
  position: relative; z-index: 1;
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  padding: 26px 46px 20px;
  gap: 14px;
}

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; animation: rise .8s both; }
.brand { font-family: var(--display); font-weight: 200; letter-spacing: .42em; font-size: 15px; text-transform: uppercase; }
.brand b { font-weight: 500; letter-spacing: .2em; }
.sys { display: flex; gap: 22px; align-items: baseline; font-family: var(--display); font-weight: 300; font-size: 14px; color: var(--dim); }
.sys .clock { font-size: 26px; font-weight: 200; color: var(--ink); letter-spacing: .06em; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; margin-right: 8px; transform: translateY(-1px); }
.dot.ok { background: #7dffb0; box-shadow: 0 0 12px #7dffb0; }
.dot.busy { background: var(--warm); box-shadow: 0 0 12px var(--warm); animation: pulse 1s infinite; }

/* tile row */
.row { animation: rise .8s .12s both; }
.tiles { display: flex; gap: 14px; align-items: flex-end; height: 132px; padding-left: 4px; }
.tile {
  flex: 0 0 auto; width: 96px; height: 96px;
  border: 1px solid var(--faint);
  background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
  display: grid; place-items: center;
  cursor: pointer; outline: none;
  transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s, border-color .28s;
  position: relative;
}
.tile svg { width: 44%; height: 44%; stroke: var(--ink); fill: none; stroke-width: 1.4; opacity: .85; }
.tile.sel {
  width: 128px; height: 128px;
  border-color: rgba(255,255,255,.9);
  box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 0 34px rgba(95,180,255,.65), inset 0 0 26px rgba(95,180,255,.25);
  background: linear-gradient(150deg, rgba(120,190,255,.42), rgba(20,60,170,.25));
}
.tile.sel::after {
  content: ""; position: absolute; inset: -1px;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
  background-size: 250% 100%; animation: sheen 3.2s infinite; pointer-events: none;
}
.caption { margin-top: 10px; padding-left: 4px; min-height: 46px; }
.caption h2 { font-weight: 400; font-size: 21px; letter-spacing: .05em; }
.caption p { color: var(--dim); font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* main */
.main { display: grid; grid-template-columns: 1fr 330px; gap: 26px; min-height: 0; animation: rise .8s .24s both; }
.log {
  background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px);
  padding: 22px 28px; overflow-y: auto; min-height: 0; scroll-behavior: smooth;
}
.log::-webkit-scrollbar { width: 5px; } .log::-webkit-scrollbar-thumb { background: var(--faint); }
.msg { margin-bottom: 22px; }
.who { font-family: var(--display); font-size: 11px; letter-spacing: .34em; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
.msg.user .text { color: var(--glow); font-weight: 400; }
.text { font-size: 18px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
.think { font-size: 13.5px; line-height: 1.7; color: var(--dim); white-space: pre-wrap; border-left: 1px solid var(--faint); padding-left: 12px; margin-bottom: 8px; }
.think:empty { display: none; }
.caret { display: inline-block; width: 9px; height: 1.05em; background: var(--ink); vertical-align: -3px; margin-left: 2px; animation: blink .9s steps(2) infinite; }
.empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 15px; line-height: 2; }
.empty strong { display: block; font-family: var(--display); font-weight: 100; font-size: 54px; letter-spacing: .12em; color: var(--ink); }

/* hud */
.hud { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px); padding: 18px 20px; }
.label { font-family: var(--display); font-size: 11px; letter-spacing: .34em; color: var(--dim); text-transform: uppercase; }
.speed { font-family: var(--display); font-weight: 100; font-size: 104px; line-height: 1; letter-spacing: -.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.speed small { font-size: 17px; font-weight: 300; letter-spacing: .2em; color: var(--dim); margin-left: 8px; }
#spark { width: 100%; height: 54px; margin-top: 10px; display: block; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; margin-top: 4px; }
.stat b { display: block; font-family: var(--display); font-weight: 200; font-size: 27px; font-variant-numeric: tabular-nums; }
.spec { font-size: 12.5px; line-height: 1.95; color: var(--dim); }
.spec i { font-style: normal; color: var(--ink); }

/* input */
.bottom { animation: rise .8s .36s both; }
.ask { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--faint); padding: 6px 8px 6px 20px; backdrop-filter: blur(10px); }
.ask:focus-within { border-color: rgba(255,255,255,.7); box-shadow: 0 0 26px rgba(95,180,255,.4); }
.ask input { flex: 1; background: none; border: 0; outline: 0; color: var(--ink); font: 300 17px var(--body); padding: 10px 0; }
.ask input::placeholder { color: var(--dim); }
button {
  font: 300 13px var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--ink);
  background: rgba(255,255,255,.08); border: 1px solid var(--faint); padding: 11px 18px; cursor: pointer;
}
button:hover, button:focus-visible { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.7); outline: none; }
button[aria-pressed="true"] { background: rgba(95,180,255,.35); border-color: var(--glow); }
.hints { display: flex; gap: 26px; justify-content: flex-end; margin-top: 10px; font-size: 12.5px; color: var(--dim); }
.hints kbd { font: 300 11px var(--display); border: 1px solid var(--faint); border-radius: 50%; min-width: 22px; height: 22px; display: inline-grid; place-items: center; margin-right: 7px; padding: 0 5px; color: var(--ink); }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } .hud { display: none; } .shell { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<div class="shell">
  <header class="top">
    <div class="brand"><b>PS4</b> Local AI</div>
    <div class="sys">
      <span><span class="dot" id="dot"></span><span id="state">接続中…</span></span>
      <span id="model">—</span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <section class="row">
    <div class="tiles" id="tiles" role="listbox" aria-label="プロンプト"></div>
    <div class="caption"><h2 id="capTitle"></h2><p id="capText"></p></div>
  </section>

  <section class="main">
    <div class="log" id="log" aria-live="polite">
      <div class="empty" id="empty"><div><strong>READY</strong>このAIは、PS4のGPUだけで動いています。<br>上のタイルを選ぶか、下に質問を入力してください。</div></div>
    </div>
    <aside class="hud">
      <div class="card">
        <div class="label">生成速度</div>
        <div class="speed"><span id="tps">0.0</span><small>tok/s</small></div>
        <canvas id="spark"></canvas>
      </div>
      <div class="card stats">
        <div class="stat"><span class="label">生成</span><b id="nGen">0</b></div>
        <div class="stat"><span class="label">ms / tok</span><b id="msTok">—</b></div>
        <div class="stat"><span class="label">入力</span><b id="nPrompt">0</b></div>
        <div class="stat"><span class="label">最高</span><b id="peak">—</b></div>
      </div>
      <div class="card spec">
        <div class="label" style="margin-bottom:6px">このマシン</div>
        GPU <i>Liverpool (GCN2, 18CU)</i><br>
        メモリ <i>GDDR5 8GB（CPUと共有）</i><br>
        OS <i>Linux + Vulkan (RADV)</i><br>
        モデル <i>SenseNova-Loop-9B / IQ4_NL</i><br>
        エンジン <i>llama.cpp + PS4向け改造</i>
      </div>
    </aside>
  </section>

  <footer class="bottom">
    <form class="ask" id="ask">
      <input id="q" autocomplete="off" placeholder="PS4に質問する…" aria-label="質問">
      <button type="button" id="think" aria-pressed="false" title="考える過程も生成する">思考</button>
      <button type="button" id="reset">新規</button>
      <button type="submit" id="go">送信</button>
    </form>
    <div class="hints">
      <span><kbd>←→</kbd>タイルを選ぶ</span>
      <span><kbd>⏎</kbd>決定</span>
      <span><kbd>Esc</kbd>生成を止める</span>
    </div>
  </footer>
</div>

<script>
// ?api=http://host:8080 overrides the server address, otherwise the page talks to the server that serves it
const API = new URLSearchParams(location.search).get('api') || (location.protocol.startsWith('http') ? '' : 'http://192.168.0.5:8080');
const $ = id => document.getElementById(id);

const PRESETS = [
  { t: 'いまの気持ち', p: 'あなたは今、ゲーム機のPS4の上で動いているAIです。その気持ちを3文で教えてください。', i: '<circle cx="12" cy="12" r="8"/>' },
  { t: '俳句', p: 'ゲーム機の中で動くAIについて、俳句を3つ詠んでください。', i: '<path d="M12 4 L20 19 H4 Z"/>' },
  { t: 'コード', p: 'Pythonでフィボナッチ数列のn番目を返す関数を書いて、仕組みを短く説明してください。', i: '<rect x="5" y="5" width="14" height="14"/>' },
  { t: '物語', p: '押し入れで眠っていた古いゲーム機が、AIとして目を覚ます短い物語を書いてください。', i: '<path d="M6 6 L18 18 M18 6 L6 18"/>' },
  { t: 'やさしい解説', p: 'コンピュータのメモリとは何かを、小学生にも分かるように説明してください。', i: '<path d="M4 12 H20 M12 4 V20"/>' },
  { t: 'English', p: 'In three sentences, explain why running a language model on a game console is fun.', i: '<path d="M4 16 Q12 2 20 16"/>' },
];

/* ---------- tiles ---------- */
let sel = 0;
const tilesEl = $('tiles');
PRESETS.forEach((x, i) => {
  const d = document.createElement('div');
  d.className = 'tile'; d.tabIndex = 0; d.setAttribute('role', 'option');
  d.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${x.i}</svg>`;
  d.setAttribute('aria-label', x.t);
  d.onclick = () => { select(i); ask(x.p); };
  d.onmouseenter = () => select(i);
  tilesEl.appendChild(d);
});
function select(i) {
  sel = (i + PRESETS.length) % PRESETS.length;
  [...tilesEl.children].forEach((c, k) => { c.classList.toggle('sel', k === sel); c.setAttribute('aria-selected', k === sel); });
  $('capTitle').textContent = PRESETS[sel].t;
  $('capText').textContent = PRESETS[sel].p;
}
select(0);

/* ---------- chat ---------- */
let history = [], ctrl = null, thinking = false;
let peak = 0, rates = [];

function addMsg(role, who) {
  $('empty')?.remove();
  const m = document.createElement('div'); m.className = 'msg ' + role;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const th = document.createElement('div'); th.className = 'think';
  const tx = document.createElement('div'); tx.className = 'text';
  m.append(w, th, tx); $('log').appendChild(m);
  return { th, tx };
}
function scrollDown() { const l = $('log'); l.scrollTop = l.scrollHeight; }
function setState(s, cls) { $('state').textContent = s; $('dot').className = 'dot ' + cls; }

async function ask(prompt) {
  prompt = prompt.trim();
  if (!prompt || ctrl) return;
  addMsg('user', 'You').tx.textContent = prompt;
  history.push({ role: 'user', content: prompt });
  const out = addMsg('ai', 'PS4');
  const caret = document.createElement('span'); caret.className = 'caret';
  out.tx.after(caret); scrollDown();

  ctrl = new AbortController();
  setState('入力を読み込み中', 'busy');
  $('go').textContent = '停止';
  rates = []; drawSpark();
  let answer = '', nTok = 0, tFirst = 0, tLast = 0;

  try {
    const res = await fetch(API + '/v1/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history, stream: true, max_tokens: 512, temperature: 0.7,
        timings_per_token: true,
        chat_template_kwargs: { enable_thinking: thinking },
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, k).trim(); buf = buf.slice(k + 2);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        const d = j.choices?.[0]?.delta || {};
        const piece = d.content || '', rpiece = d.reasoning_content || '';
        if (piece || rpiece) {
          const now = performance.now();
          if (!tFirst) { tFirst = now; setState('生成中', 'busy'); }
          else if (now > tLast) pushRate(1000 / (now - tLast));
          tLast = now; nTok++;
          if (rpiece) out.th.textContent += rpiece;
          if (piece) { answer += piece; out.tx.textContent = answer; }
          scrollDown();
        }
        const tm = j.timings;
        if (tm) {
          $('nPrompt').textContent = tm.prompt_n ?? 0;
          if (tm.predicted_n > 2 && tm.predicted_per_second > 0) showSpeed(tm.predicted_per_second, tm.predicted_n);
        } else if (nTok > 2) {
          showSpeed((nTok - 1) * 1000 / (tLast - tFirst), nTok);
        }
      }
    }
    setState('待機中', 'ok');
  } catch (e) {
    if (e.name === 'AbortError') setState('停止しました', 'ok');
    else { setState('エラー: ' + e.message, ''); if (!answer) out.tx.textContent = '（PS4に接続できませんでした）'; }
  } finally {
    caret.remove();
    if (answer) history.push({ role: 'assistant', content: answer }); else history.pop();
    ctrl = null; $('go').textContent = '送信';
  }
}

function showSpeed(tps, n) {
  $('tps').textContent = tps.toFixed(1);
  $('nGen').textContent = n;
  $('msTok').textContent = (1000 / tps).toFixed(0);
  if (n >= 8 && tps > peak) { peak = tps; $('peak').textContent = peak.toFixed(1); }
}

/* ---------- sparkline of per-token rate ---------- */
function pushRate(r) { rates.push(Math.min(r, 30)); if (rates.length > 120) rates.shift(); drawSpark(); }
function drawSpark() {
  const c = $('spark'), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(234,243,255,.16)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, h - .5); g.lineTo(w, h - .5); g.stroke();
  if (rates.length < 2) return;
  const max = Math.max(12, ...rates), step = w / 119;
  g.beginPath();
  rates.forEach((r, i) => { const x = i * step, y = h - 3 - (r / max) * (h - 8); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#eaf3ff'; g.lineWidth = 1.4; g.stroke();
  g.lineTo((rates.length - 1) * step, h); g.lineTo(0, h); g.closePath();
  const grad = g.createLinearGradient(0, 0, 0, h); grad.addColorStop(0, 'rgba(95,180,255,.45)'); grad.addColorStop(1, 'rgba(95,180,255,0)');
  g.fillStyle = grad; g.fill();
}

/* ---------- controls ---------- */
$('ask').onsubmit = e => {
  e.preventDefault();
  if (ctrl) { ctrl.abort(); return; }
  const v = $('q').value; $('q').value = ''; ask(v);
};
$('think').onclick = () => { thinking = !thinking; $('think').setAttribute('aria-pressed', thinking); };
$('reset').onclick = () => {
  if (ctrl) ctrl.abort();
  history = []; $('log').innerHTML = '<div class="empty" id="empty"><div><strong>READY</strong>新しい会話を始められます。</div></div>';
};
addEventListener('keydown', e => {
  if (e.key === 'Escape' && ctrl) { ctrl.abort(); return; }
  if (document.activeElement === $('q') && $('q').value) return;
  if (e.key === 'ArrowRight') { select(sel + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { select(sel - 1); e.preventDefault(); }
  else if (e.key === 'Enter' && document.activeElement !== $('q') && document.activeElement.tagName !== 'BUTTON') { ask(PRESETS[sel].p); e.preventDefault(); }
});

/* ---------- status ---------- */
function tick() { const d = new Date(); $('clock').textContent = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 10000);
async function health() {
  if (ctrl) return;
  try {
    const r = await fetch(API + '/health', { signal: AbortSignal.timeout(4000) });
    if (r.ok) setState('待機中', 'ok'); else setState('モデルを読み込み中', 'busy');
  } catch { setState('PS4に接続できません', ''); }
}
health(); setInterval(health, 8000);
fetch(API + '/props').then(r => r.json()).then(p => {
  const name = (p.model_path || '').split('/').pop().replace('.gguf', '');
  if (name) $('model').textContent = name;
}).catch(() => {});

/* ---------- background ribbons ---------- */
(() => {
  const c = $('waves'), g = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h;
  const fit = () => { const dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); };
  fit(); addEventListener('resize', fit);
  const ribbons = [0, 1, 2, 3, 4].map(i => ({ y: .34 + i * .075, amp: 46 + i * 16, len: 520 + i * 130, sp: .00016 + i * .00005, ph: i * 1.7, a: .13 - i * .017 }));
  function frame(t) {
    g.clearRect(0, 0, w, h);
    for (const r of ribbons) {
      g.beginPath();
      for (let x = -20; x <= w + 20; x += 14) {
        const y = h * r.y + Math.sin(x / r.len + t * r.sp * 6 + r.ph) * r.amp + Math.sin(x / (r.len * .37) - t * r.sp * 3) * r.amp * .28;
        x === -20 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.lineTo(w + 20, h); g.lineTo(-20, h); g.closePath();
      const grad = g.createLinearGradient(0, h * r.y - r.amp, 0, h);
      grad.addColorStop(0, `rgba(150,205,255,${r.a})`); grad.addColorStop(.5, `rgba(40,110,230,${r.a * .5})`); grad.addColorStop(1, 'rgba(2,10,44,0)');
      g.fillStyle = grad; g.fill();
      g.strokeStyle = `rgba(210,235,255,${r.a * 1.5})`; g.lineWidth = 1; g.stroke();
    }
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
